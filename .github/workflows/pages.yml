# Veröffentlicht die Produktbilder aus cdn/ auf GitHub Pages, damit sie nicht
# über das App-Hosting (Supabase) ausgeliefert werden.
# URL: https://aurelwidmaier.github.io/pelaro_config/parts/<kategorie>/<datei>
name: Deploy images to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['cdn/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Manifest der Komplettbike-Bilder erzeugen
        run: |
          mkdir -p cdn/bikes
          find cdn/bikes -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
            -printf '%f\n' | sort | jq -R . | jq -s . > cdn/bikes/manifest.json
          cat cdn/bikes/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cdn
      - id: deployment
        uses: actions/deploy-pages@v4
